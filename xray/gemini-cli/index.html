<title>gemini-cli - Architecture X-ray</title>
<style>
:root {
  --bg: #f5f3ee; --surface: #ffffff; --surface-2: #faf9f6; --ink: #151a22; --muted: #5a6473;
  --line: #e0dcd2; --accent: #0a66c2; --accent-soft: #e4effa; --accent-ink: #084f96;
  --hero: #0a1120; --hero-2: #101b33; --hero-ink: #eaf1fb; --hero-muted: #93a5c1; --hero-line: rgba(120,160,220,.16);
  --ok: #17794a; --ok-soft: #e2f3ea; --warn: #9a5a00; --warn-soft: #fbefd9; --spec: #6b4fd0; --spec-soft: #ece7fb;
  --risk: #b3402e; --risk-soft: #fbe9e5;
  --d-person: #0b3d75; --d-system: #0a66c2; --d-component: #5aa2e6; --d-ext: #7c8696; --d-store: #17794a; --d-queue: #9a5a00;
  --d-on: #ffffff; --d-on-light: #0a1120; --d-line: #6b7686; --d-group: #f0ede6; --d-group-line: #b9b3a5;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c111b; --surface: #131a27; --surface-2: #171f2e; --ink: #e6ecf5; --muted: #98a4b7;
    --line: #253044; --accent: #6db3ff; --accent-soft: #15273f; --accent-ink: #9bcbff;
    --hero: #070c17; --hero-2: #0e172b;
    --ok: #5fd39a; --ok-soft: #12301f; --warn: #f0b458; --warn-soft: #33260e; --spec: #b3a1ff; --spec-soft: #241d44;
    --risk: #ff9482; --risk-soft: #3a1a15;
    --d-person: #9bcbff; --d-system: #3d8fe6; --d-component: #1f4f86; --d-ext: #4a5568; --d-store: #2a9d68; --d-queue: #c98a2b;
    --d-on: #ffffff; --d-on-light: #0a1120; --d-line: #8b98ad; --d-group: #172133; --d-group-line: #3a4860;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: .86em var(--mono); background: var(--accent-soft); color: var(--accent-ink); padding: .1em .38em; border-radius: 4px; overflow-wrap: anywhere; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

.hero { background:
    linear-gradient(var(--hero-line) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(90deg, var(--hero-line) 1px, transparent 1px) 0 0 / 32px 100%,
    radial-gradient(1200px 500px at 15% -10%, #17366b 0%, transparent 60%),
    linear-gradient(180deg, var(--hero) 0%, var(--hero-2) 100%);
  color: var(--hero-ink); padding: 56px 0 44px; }
.kicker { font: 600 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #7fb7ff; margin: 0 0 18px; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.04; letter-spacing: -.025em; margin: 0 0 14px; font-weight: 700; overflow-wrap: anywhere; }
.tagline { font-size: clamp(17px, 2.3vw, 21px); color: var(--hero-muted); margin: 0 0 26px; max-width: 46em; }
.thesis { font-size: 17px; max-width: 50em; margin: 0 0 30px; padding-left: 16px; border-left: 3px solid #4d9bf0; color: var(--hero-ink); }
.thesis code, .tagline code { background: rgba(120,170,240,.16); color: #cfe3ff; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--hero-line); border: 1px solid var(--hero-line); border-radius: 10px; overflow: hidden; }
.stat { background: rgba(10,17,32,.72); padding: 14px 16px; }
.stat b { display: block; font: 600 22px/1.2 var(--sans); letter-spacing: -.01em; }
.stat span { font: 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--hero-muted); }
.meta { margin-top: 18px; font: 12px/1.6 var(--mono); color: var(--hero-muted); overflow-wrap: anywhere; }
.meta a { color: #9bcbff; }

nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav .wrap { display: flex; gap: 20px; overflow-x: auto; padding-top: 11px; padding-bottom: 11px; scrollbar-width: none; }
nav a { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
nav a:hover { color: var(--accent); text-decoration: none; }

section { padding: 52px 0 8px; }
h2 { font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -.02em; line-height: 1.15; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 26px; max-width: 46em; }
.num { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); display: block; margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
h3 { font-size: 18px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -.01em; }
p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.tag { display: inline-block; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-ink); margin-bottom: 10px; }
.tag.documented { background: var(--ok-soft); color: var(--ok); }
.tag.inferred { background: var(--warn-soft); color: var(--warn); }
.tag.speculative { background: var(--spec-soft); color: var(--spec); }
.tag.plain { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.evidence { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--line); font: 12.5px/1.6 var(--mono); color: var(--muted); }
.evidence li { overflow-wrap: anywhere; padding-left: 14px; position: relative; }
.evidence li::before { content: "\2192"; position: absolute; left: 0; color: var(--accent); }

.diagram { padding: 0; overflow: hidden; margin-bottom: 18px; }
.diagram header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.diagram header p { color: var(--muted); margin: 0; }
.canvas { padding: 22px 16px; overflow-x: auto; text-align: center; background: var(--surface-2); }
.canvas svg { max-width: 100%; height: auto; }
.canvas svg .edgeLabel, .canvas svg .edgeLabel p, .canvas svg .edgeLabel span { color: var(--ink) !important; fill: var(--ink) !important; background-color: var(--surface-2) !important; font-size: 12.5px; }
.canvas svg .cluster-label, .canvas svg .cluster-label p, .canvas svg .cluster-label span { color: var(--muted) !important; fill: var(--muted) !important; }
.canvas pre { text-align: left; font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 0; white-space: pre-wrap; }
.note { font: 12.5px/1.5 var(--mono); color: var(--warn); margin: 0 0 10px; text-align: left; }
details.src { border-top: 1px solid var(--line); padding: 10px 20px; font: 12px/1.5 var(--mono); color: var(--muted); }
details.src summary { cursor: pointer; }
details.src pre { white-space: pre-wrap; margin: 10px 0 4px; overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 12px/1 var(--mono); color: var(--muted); margin: 0 0 18px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { white-space: nowrap; }
.tablewrap { overflow-x: auto; }

.decision { display: grid; grid-template-columns: 54px 1fr; gap: 4px 16px; margin-bottom: 16px; }
.decision .idx { font: 700 30px/1 var(--mono); color: var(--line); padding-top: 4px; }
.decision dl { margin: 6px 0 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px 14px; }
.decision dt { font: 600 11px/1.9 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.decision dd { margin: 0; }
.when { font: 12px var(--mono); color: var(--muted); margin-left: 8px; }

.timeline { position: relative; margin-left: 8px; padding-left: 28px; border-left: 2px solid var(--line); }
.era { position: relative; margin-bottom: 18px; }
.era::before { content: ""; position: absolute; left: -36px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--accent); }
.period { font: 600 12.5px/1 var(--mono); letter-spacing: .08em; color: var(--accent); display: block; margin-bottom: 8px; }
.era ul { margin: 8px 0 10px; padding-left: 18px; }
.era li { margin-bottom: 3px; }
.why { background: var(--surface-2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 6px 6px 0; margin: 10px 0 0; }
.why b { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }

.col h3.head { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px; }
.col.s h3.head { color: var(--ok); } .col.r h3.head { color: var(--risk); }
.point { border-left: 3px solid var(--ok); background: var(--surface); border-radius: 0 10px 10px 0; padding: 14px 16px; margin-bottom: 12px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.col.r .point { border-left-color: var(--risk); }
.point h4 { margin: 0 0 4px; font-size: 16px; }
.point p { margin: 0; color: var(--muted); }

.takeaways { counter-reset: t; list-style: none; padding: 0; margin: 0; }
.takeaways li { counter-increment: t; position: relative; padding: 14px 0 14px 46px; border-bottom: 1px solid var(--line); font-size: 17px; }
.takeaways li:last-child { border-bottom: 0; }
.takeaways li::before { content: counter(t, decimal-leading-zero); position: absolute; left: 0; top: 17px; font: 600 13px var(--mono); color: var(--accent); }

footer { margin-top: 56px; padding: 28px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; }
footer ul { padding-left: 18px; margin: 8px 0 14px; }
footer .gen { font: 12px var(--mono); }
@media (max-width: 560px) {
  .decision { grid-template-columns: 1fr; } .decision .idx { font-size: 20px; }
  .decision dl { grid-template-columns: 1fr; gap: 2px; } .decision dd { margin-bottom: 8px; }
  td:first-child { white-space: normal; }
}
@media print { nav { display: none; } .card, .point { break-inside: avoid; } }
</style>

ension and default rules.", "evidence": [{"label": "packages/core/src/policy/policy-engine.ts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/policy/policy-engine.ts"}, {"label": "packages/core/src/policy/config.ts: tier constants", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/policy/config.ts"}, {"label": "packages/core/src/policy/policies/read-only.toml", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/policy/policies/read-only.toml"}]}, {"name": "Chain of responsibility for model choice", "kind": "pattern", "summary": "`ModelRouterService` builds a `CompositeStrategy` of routing strategies (fallback, override, approval mode, classifiers, default); the first to decide wins.", "evidence": [{"label": "packages/core/src/routing/modelRouterService.ts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/routing/modelRouterService.ts"}, {"label": "packages/core/src/routing/strategies/compositeStrategy.ts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/routing/strategies/compositeStrategy.ts"}]}, {"name": "Decorated model client", "kind": "pattern", "summary": "`ContentGenerator` is one interface for every auth route; logging, model mapping, recording and fake implementations wrap or replace the real one.", "evidence": [{"label": "packages/core/src/core/contentGenerator.ts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/contentGenerator.ts"}, {"label": "packages/core/src/core/loggingContentGenerator.ts", "url": "https://github.com/google-gemini/gemini-cli/blob/fb972b2f87fe7d5b06d37eac711490162d98de2c/packages/core/src/core/loggingContentGenerator.ts"}]}, {"nam e": "Heavy investment in tests", "detail": "Over 1,000 test files in `cli` and `core`, plus integration, behavioural-eval, performance and memory test suites at the top level."}], "risks": [{"title": "Five loop drivers until the new session lands", "detail": "The interactive hook, non-interactive mode, ACP, SDK and A2A server each call `sendMessageStream` and schedule tools themselves. The `AgentSession` replacement is behind settings that default to off, and its adapter is named `Legacy`."}, {"title": "`Config` is a god object", "detail": "`packages/core/src/config/config.ts` is 4,249 lines with 186 getters and is the most-changed file in the repository. `AgentLoopContext` is the stated fix and still wraps it."}, {"title": "Very large UI modules", "detail": "`AppContainer.tsx` (2,877 lines) and `useGeminiStream.ts` (2,299 lines) concentrate interactive behaviour and are among the most-changed files."}, {"title": "Churn in sub-agents and context management", "detail": "The sub-agent tool shape changed three times in eight months, and `contextManager.ts` was added, deleted two days later and re-added within two weeks during the spring 2026 rework. Extension authors build on moving ground here."}, {"title": "A porous package boundary", "detail": "Core re-exports from 26 directories, including 104 utility files, so front ends depend on internals and the two largest packages rarely change independently."}]}, "takeaways": ["Separate the engine from the UI early. This project did it in week one, and every later surface (SDK, server, editor protocol) was built on that split.", "If the engine only yields events and the caller runs the loop, each new front end copies the loop. Decide who owns the loop before the third front end.", "Put approval and policy in one pipeline that all tools pass through, and make the rules data. It is the only way to give administrators a guaranteed override.", "Land big internal changes as: new path unused, switch over, delete the old path. And
