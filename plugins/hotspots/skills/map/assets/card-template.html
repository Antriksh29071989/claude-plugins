<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__CARD_NAME__ - share card</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; color: #eaf1fb;
  background:
    linear-gradient(rgba(120,160,220,.13) 1px, transparent 1px) 0 0 / 100% 42px,
    linear-gradient(90deg, rgba(120,160,220,.13) 1px, transparent 1px) 0 0 / 42px 100%,
    radial-gradient(900px 520px at 12% -8%, #1b4285 0%, transparent 62%),
    radial-gradient(700px 420px at 100% 110%, #123a6e 0%, transparent 60%),
    linear-gradient(180deg, #070c17 0%, #0f1a31 100%);
  padding: 58px 64px 50px; display: flex; flex-direction: column;
}
.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
.top { display: flex; justify-content: space-between; align-items: center; }
.kicker { font-size: 20px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #7fb7ff; }
.repo { font-size: 19px; color: #93a5c1; }
.body { flex: 1; display: flex; align-items: center; gap: 40px; }
.text { flex: 1; min-width: 0; }
h1 { margin: 0 0 22px; font-weight: 700; letter-spacing: -.03em; line-height: 1; overflow-wrap: anywhere; }
.hook { margin: 0; font-size: 36px; line-height: 1.24; letter-spacing: -.01em; color: #c9d8ee; max-width: 19em; text-wrap: balance; }
.art { width: 300px; flex: none; opacity: .95; }
.stats { display: flex; gap: 0; border: 1px solid rgba(120,160,220,.28); border-radius: 14px; overflow: hidden; background: rgba(8,14,28,.55); }
.stat { flex: 1; padding: 16px 22px; border-right: 1px solid rgba(120,160,220,.28); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.stat span { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #93a5c1; white-space: nowrap; }
</style>
</head>
<body>
  <div class="top">
    <div class="kicker mono">Tech-debt hotspot map</div>
    <div class="repo mono">__CARD_REPO__</div>
  </div>
  <div class="body">
    <div class="text">
      <h1 style="font-size: __CARD_NAME_SIZE__px">__CARD_NAME__</h1>
      <p class="hook">__CARD_HOOK__</p>
    </div>
    <svg class="art" viewBox="0 0 300 300" fill="none" aria-hidden="true">
      <rect x="0" y="0" width="150" height="120" rx="5" fill="#cde2fb"/>
      <rect x="154" y="0" width="86" height="120" rx="5" fill="#6da7ec"/>
      <rect x="244" y="0" width="56" height="58" rx="5" fill="#256abf"/>
      <rect x="244" y="62" width="56" height="58" rx="5" fill="#184f95"/>
      <rect x="0" y="124" width="96" height="90" rx="5" fill="#9ec5f4"/>
      <rect x="100" y="124" width="74" height="90" rx="5" fill="#3987e5"/>
      <rect x="178" y="124" width="122" height="44" rx="5" fill="#184f95"/>
      <rect x="178" y="172" width="58" height="42" rx="5" fill="#0d366b"/>
      <rect x="240" y="172" width="60" height="42" rx="5" fill="#256abf"/>
      <rect x="0" y="218" width="64" height="82" rx="5" fill="#184f95"/>
      <rect x="68" y="218" width="106" height="82" rx="5" fill="#0d366b"/>
      <rect x="178" y="218" width="122" height="82" rx="5" fill="#3987e5"/>
    </svg>
  </div>
  <div class="stats">__CARD_STATS__</div>
</body>
</html>
