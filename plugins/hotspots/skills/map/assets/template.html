<style>

  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;

@media (prefers-color-scheme: dark) {

    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --accent: #3987e5; --accent-soft: #14253c; --accent-ink: #9ec5f4;
    --none: #383835;
    --h1: #0d366b; --h2: #184f95; --h3: #256abf; --h4: #3987e5; --h5: #6da7ec; --h6: #9ec5f4; --h7: #cde2fb;

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

.hero { background:
    linear-gradient(var(--hero-line) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(90deg, var(--hero-line) 1px, transparent 1px) 0 0 / 32px 100%,
    radial-gradient(1200px 500px at 15% -10%, #17366b 0%, transparent 60%),

  color: var(--hero-ink); padding: 56px 0 44px; }
.kicker { font: 600 12px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #7fb7ff; margin: 0 0 18px; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.04; letter-spacing: -.025em; margin: 0 0 14px; font-weight: 700; overflow-wrap: anywhere; }
.thesis { font-size: 18px; max-width: 50em; margin: 0 0 30px; padding-left: 16px; border-left: 3px solid #4d9bf0; }
.thesis code { background: rgba(120,170,240,.16); color: #cfe3ff; }

section { padding: 48px 0 6px; }
h2 { font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -.02em; line-height: 1.15; margin: 0 0 6px; }
.sub { color: var(--ink-2); margin: 0 0 22px; max-width: 48em; }
.num { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); display: block; margin-bottom: 10px; }

.tip span { color: var(--ink-2); display: block; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

.hot { display: grid; grid-template-columns: 54px 1fr; gap: 4px 16px; margin-bottom: 16px; }
.hot .idx { font: 700 30px/1 var(--mono); color: var(--axis); padding-top: 4px; }

.role { color: var(--ink-2); margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }

.spark svg { width: 120px; height: 30px; flex: none; }
dl { margin: 0; display: grid; grid-template-columns: 118px 1fr; gap: 8px 14px; }
dt { font: 600 11px/1.9 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.evidence li { overflow-wrap: anywhere; padding-left: 14px; position: relative; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 11px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 12px 10px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }

td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.p { font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; min-width: 220px; }
.bar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); vertical-align: middle; margin-right: 8px; }
.pair { font: 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
.pair small { display: block; font: 14px/1.5 var(--sans); color: var(--ink-2); margin-top: 4px; }

.plan { counter-reset: t; list-style: none; padding: 0; margin: 0; }
.plan li { counter-increment: t; position: relative; padding: 14px 0 14px 46px; border-bottom: 1px solid var(--grid); font-size: 17px; }
.plan li:last-child { border-bottom: 0; }
.plan li::before { content: counter(t, decimal-leading-zero); position: absolute; left: 0; top: 17px; font: 600 13px var(--mono); color: var(--accent); }

@media (max-width: 560px) {
  .hot { grid-template-columns: 1fr; } .hot .idx { font-size: 20px; }
  dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 8px; }
}
@media print { nav { display: none; } .card { break-inside: avoid; } }
