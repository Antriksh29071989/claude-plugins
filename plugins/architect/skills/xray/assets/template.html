      labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--warn-soft"), noteTextColor: v("--ink"), noteBorderColor: v("--d-group-line"),
      activationBkgColor: v("--accent-soft"), activationBorderColor: v("--d-line"), sequenceNumberColor: v("--d-on")
    },
    flowchart: { curve: "basis", useMaxWidth: true, padding: 14, nodeSpacing: 46, rankSpacing: 58 },
    sequence: { useMaxWidth: true, mirrorActors: false, wrap: true }
  });
  canvases.reduce(function (chain, c, i) {
    return chain.then(function () {
      var code = c[1];
      if (/^\s*(flowchart|graph)\b/.test(code)) code += classDefs;
      return window.mermaid.render("xray-diagram-" + i, code).then(function (out) {
        c[0].innerHTML = out.svg;
      }).catch(function (err) {
        fail(c[0], "This diagram could not be rendered: " + String(err && err.message || err).split("\n")[0]);
        var stray = document.getElementById("dxray-diagram-" + i); if (stray) stray.remove();
      });
    });
  }, Promise.resolve());
})();
</script>
